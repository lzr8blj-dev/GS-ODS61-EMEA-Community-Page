<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Business Services</title>
<style>
  :root {
    --bosch-blue: #0071b3;
    --bosch-blue-dark: #005a8c;
    --border-grey: #d8dde2;
    --bg-grey: #f6f7f8;
    --text-dark: #1c1c1c;
    --navbar-height: 56px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100dvh;
    width: 100%;
    overflow: clip; /* stronger than hidden — guarantees no scrollbar */
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text-dark);
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* ---------- Navbar ---------- */
  .brand-bar {
    flex: 0 0 4px;
    background-color: var(--bosch-blue);
  }

  .navbar {
    flex: 0 0 var(--navbar-height);
    height: var(--navbar-height);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background-color: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
    padding: 0 24px;
    white-space: nowrap;
    overflow: hidden;
  }

  .navbar .nav-item {
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 14.5px;
    color: #3a3f44;
    cursor: default; /* not clickable yet, links coming later */
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .navbar .nav-item:hover {
    background-color: #eaf3fb;
    color: var(--bosch-blue-dark);
  }

  /* ---------- Hero ---------- */
  .hero-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-grey);
    min-height: 0; /* allows flexbox to actually shrink this on short screens */
    overflow: hidden;
    padding: 12px;
  }

  .hero {
    position: relative;
    aspect-ratio: 1920 / 1080; /* locks to the image's real proportions */
    max-width: 100%;
    max-height: 100%;
  }

  .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain; /* guarantees the full image is always visible, never cropped */
  }

  /* ---------- Hexagon hotspots ---------- */
  .hotspot {
    position: absolute;
    display: block;
    text-decoration: none;
  }

  .hotspot--feedback {
    top: 5.37%;
    right: 17%;
    width: 13.02%;
    height: 20%;
  }

  .hotspot--book {
    top: 20.09%;
    right: 4.5%;
    width: 13.02%;
    height: 20%;
  }

  .hotspot .hex-border {
    display: block;
    width: 100%;
    height: 100%;
    background-color: var(--bosch-blue);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    transition: background-color 0.2s ease;
  }

  .hotspot .hex-fill {
    position: absolute;
    inset: 8px; /* thicker border band, was 3px */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: rgba(255, 255, 255, 0.97);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    color: var(--bosch-blue);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
    padding: 4px;
  }

  .hotspot .hex-icon {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  .hotspot:hover .hex-border {
    background-color: var(--bosch-blue-dark);
  }

  /* ---------- Small screens: relax the no-scroll rule so content isn't crushed ---------- */
  @media (max-width: 600px) {
    html, body {
      overflow-y: auto;
      height: auto;
    }

    .navbar {
      flex-wrap: wrap;
      height: auto;
      padding: 8px 12px;
    }

    .hero-wrap {
      min-height: 60vh;
    }
  }
</style>
</head>
<body>

<div class="brand-bar"></div>
<nav class="navbar">
  <span class="nav-item">Home</span>
  <span class="nav-item">Who we are</span>
  <span class="nav-item">Services &amp; Solutions</span>
  <span class="nav-item">Global Footprint</span>
  <span class="nav-item">Resources &amp; Processes</span>
  <span class="nav-item">News</span>
  <span class="nav-item">Support &amp; FAQ</span>
</nav>

<div class="hero-wrap">
  <div class="hero">
    <img src="images/hero.jpg" alt="Global Business Services hero graphic" />

    <a class="hotspot hotspot--feedback" href="https://boschdigital.qualtrics.com/jfe/form/SV_et9eWrQTWuzZym2?Referrer=rb-ux-studio&amp;Offering=Planning+as+a+Service&amp;OfferingID=FB-0000443&amp;Source=Email&amp;SourceCategory=Use&amp;Stage=Prod&amp;SurveyStyle=Fullscreen&amp;FeedbackReceiverRegionID=EMEA" target="_blank" rel="noopener">
      <span class="hex-border"></span>
      <span class="hex-fill">
        <!-- TODO: replace with your own icon, e.g. images/icon-feedback.png -->
        <img class="hex-icon" src="images/icon-placeholder.svg" alt="" />
        Feedback
      </span>
    </a>

    <a class="hotspot hotspot--book" href="mailto:Paul.Oancea@ro.bosch.com?subject=Booking Inquiry&amp;body=Hello, I would like to book your services.">
      <span class="hex-border"></span>
      <span class="hex-fill">
        <!-- TODO: replace with your own icon, e.g. images/icon-booking.png -->
        <img class="hex-icon" src="images/icon-placeholder.svg" alt="" />
        Book our services
      </span>
    </a>
  </div>
</div>

</body>
</html>
